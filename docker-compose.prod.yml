version: '3.8'
services:
  nuxt3-ssg-test:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: nuxt3_ssg_test:latest # 为镜像指定一个名称
    ports:
      - "127.0.0.1:3104:80" # 只給本機除錯用；正式流量走 MainNginx 反代
    volumes:
      - ./var/log/nginx:/var/log/nginx
    networks:
      - main-network
networks:
  main-network:
    external: true